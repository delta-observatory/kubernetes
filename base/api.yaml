# Stateless API. Reads PostgreSQL and the artifact volume. Never calls the worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delta-api
  namespace: delta-observatory
  labels: {app.kubernetes.io/name: delta-api, app.kubernetes.io/part-of: delta-observatory}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: delta-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: delta-api, app.kubernetes.io/part-of: delta-observatory}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: localhost/delta-backend:latest
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: delta-db-app, key: uri}}
          envFrom:
            - configMapRef: {name: delta-api-env}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: artifacts, mountPath: /data/artifacts, readOnly: true}
            - {name: datasets, mountPath: /data/datasets, readOnly: true}
            # The cohort guard reads experiments/cohorts.json. A directory mount shows each atomic replace of the file.
            - {name: experiments, mountPath: /data/experiments, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: delta-artifacts}
        - name: datasets
          hostPath: {path: /home/richardtidwell/repos/delta-observatory/datasets, type: Directory}
        - name: experiments
          hostPath: {path: /home/richardtidwell/repos/delta-observatory/experiments, type: Directory}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: delta-api
  namespace: delta-observatory
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: delta-api}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30870}
