# Frontend: static files and an /api/ proxy to delta-api. It keeps no state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delta-frontend
  namespace: delta-observatory
  labels: {app.kubernetes.io/name: delta-frontend, app.kubernetes.io/part-of: delta-observatory}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: delta-frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: delta-frontend, app.kubernetes.io/part-of: delta-observatory}
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: localhost/delta-frontend:latest
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: delta-frontend
  namespace: delta-observatory
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: delta-frontend}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30871}
