apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: delta-observatory
resources:
  - namespace.yaml
  - database.yaml
  - storage.yaml
  - worker.yaml
  - api.yaml
  - frontend.yaml
configMapGenerator:
  - name: delta-worker-env
    literals:
      - DELTA_RAW_ROOT=/data/raw
      - DELTA_CATALOG_ROOT=/data/catalog
      - DELTA_ARTIFACT_ROOT=/data/artifacts
      - DELTA_DATASETS=tess-spoc-light-curves
      - DELTA_LEASE_SECONDS=60
  - name: delta-api-env
    literals:
      - DELTA_ARTIFACT_ROOT=/data/artifacts
      - DELTA_CORS_ORIGINS=
      - DELTA_COHORTS_PATH=/data/experiments/cohorts.json
      - DELTA_DATASETS_ROOT=/data/datasets
      - DELTA_EXPERIMENTS_ROOT=/data/experiments
      - DELTA_GUI_READ_CLIENT=gui-browser
  # Image tags of the running release. Keep them equal to images[].newTag.
  # Source commits: database 4e0d1ae, workers ea1f95e, backend c289df5, frontend d098461.
  # Update this line with each release. The build context is the working tree, so commit first.
  # A fixed name: a tag change for one component does not restart the others.
  - name: delta-versions
    options:
      disableNameSuffixHash: true
    literals:
      - database=0.1.0-20261018122748
      - workers=0.1.0-20261018122824
      - backend=0.1.0-20261023201212
      - frontend=0.1.0-20261023201214
images:
  - name: localhost/delta-workers
    newTag: 0.1.0-20261018122824
  - name: localhost/delta-backend
    newTag: 0.1.0-20261023201212
  - name: localhost/delta-frontend
    newTag: 0.1.0-20261023201214
