[defaults]
inventory = ~/.config/delta-observatory/ansible/inventory.yml
collections_path = ~/.local/share/delta-observatory/ansible/collections
roles_path = ./roles
interpreter_python = /usr/bin/python3
stdout_callback = default
result_format = yaml
retry_files_enabled = false

[privilege_escalation]
become_method = sudo
# Ubuntu 26.04 uses sudo-rs, which wraps the password prompt that Ansible
# expects. sudo.ws is the original sudo with the same sudoers rules.
become_exe = sudo.ws

[ssh_connection]
pipelining = true
