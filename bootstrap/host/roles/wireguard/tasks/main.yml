# The interface configuration contains the private key. This role checks its
# protection but does not manage its content.
- name: Install WireGuard tools
  ansible.builtin.apt:
    name: wireguard-tools
    state: present

- name: Restrict the WireGuard directory to root
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Restrict the interface configuration to root
  ansible.builtin.file:
    path: "/etc/wireguard/{{ delta_wg_interface }}.conf"
    state: file
    owner: root
    group: root
    mode: "0600"

- name: Start the management interface at boot
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ delta_wg_interface }}.service"
    enabled: true
    state: started
