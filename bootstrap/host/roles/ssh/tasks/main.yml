# Ubuntu reads this file before the cloud image's SSH configuration files.
- name: Require SSH key authentication and refuse root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-delta-access.conf
    content: |
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH

- name: Start SSH through its socket at boot
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: true
    state: started
