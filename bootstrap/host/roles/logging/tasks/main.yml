# The journal is on /var. These limits keep it from filling that filesystem.
- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limit the journal size and retention
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-delta-limits.conf
    content: |
      [Journal]
      SystemMaxUse={{ logging_journal_max_use }}
      MaxRetentionSec={{ logging_journal_retention }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
